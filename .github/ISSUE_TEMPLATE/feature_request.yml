name: 功能建议
description: 提议新的工作流或体验改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 请先描述使用场景，而不只是具体按钮或界面
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的使用方式
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: 文件安全影响
      description: 是否涉及移动、重命名、删除、外部目录或管理员权限
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方式
