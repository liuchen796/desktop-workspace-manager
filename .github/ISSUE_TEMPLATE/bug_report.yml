name: Bug 报告
description: 报告可稳定复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先移除截图、路径和日志中的个人信息。
  - type: input
    id: version
    attributes:
      label: 桌面工作台版本
      placeholder: 例如 1.13.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 与显示环境
      placeholder: 例如 Windows 11 24H2，双屏，125% / 150%
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 请按顺序描述操作
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可添加脱敏截图或错误信息
