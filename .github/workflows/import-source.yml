name: Import source bundle

on:
  push:
    paths:
      - desktop-workspace-source-v2.zip

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract tracked source files
        shell: bash
        run: |
          unzip -o desktop-workspace-source-v2.zip -d .
          rm -f desktop-workspace-source-v2.zip

      - name: Commit complete source tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish complete source tree"
          git push
